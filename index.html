<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project760</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Chakra+Petch:wght@500;600&display=swap" rel="stylesheet">
<style id="css">
:root{
  --bg:#EFEFEC; --surface:#EFEFEC; --ink:#121212; --muted:#6B6B6B; --line:#C9C9C4;
  --tape:#121212; --tape-ink:#EFEFEC;
  --red:#E5322D; --yellow:#F2A900; --green:#00A86B; --gray:#9A9A9A;
  --red-soft:#F7DEDC; --yellow-soft:#FBEFD1; --green-soft:#D7F0E5; --gray-soft:#E3E3DF;
  --lens-off:#DADAD5; --yellow-ink:#A87500; --grid:rgba(18,18,18,.055);
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1A1A; --surface:#1A1A1A; --ink:#F2F2F2; --muted:#8C8C8C; --line:#3A3A3A;
  --tape:#F2F2F2; --tape-ink:#1A1A1A;
  --red:#FF453A; --yellow:#FFC400; --green:#30D158; --gray:#6E6E6E;
  --red-soft:#3A1715; --yellow-soft:#3A2F0E; --green-soft:#11301D; --gray-soft:#242424;
  --lens-off:#2A2A2A; --yellow-ink:#FFC400; --grid:rgba(242,242,242,.05);
  color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1A1A; --surface:#1A1A1A; --ink:#F2F2F2; --muted:#8C8C8C; --line:#3A3A3A;
  --tape:#F2F2F2; --tape-ink:#1A1A1A;
  --red:#FF453A; --yellow:#FFC400; --green:#30D158; --gray:#6E6E6E;
  --red-soft:#3A1715; --yellow-soft:#3A2F0E; --green-soft:#11301D; --gray-soft:#242424;
  --lens-off:#2A2A2A; --yellow-ink:#FFC400; --grid:rgba(242,242,242,.05);
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Sora",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
header.top{padding:8px 0 4px}
.tape{display:inline-block;background:var(--tape);color:var(--tape-ink);font:700 15px/1 "Sora",system-ui,sans-serif;letter-spacing:.02em;padding:7px 14px 6px;transform:rotate(-1.6deg);clip-path:polygon(2% 0,100% 4%,98% 100%,0 96%);margin-bottom:10px}
h1{font:700 34px/1.05 "Sora",system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.005em}
.sub{color:var(--muted);margin:0;font-size:15px}
.summary{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;margin-top:10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--lens-off)}
.bar span{display:block;height:100%;transition:width .35s ease}
.bar .r{background:var(--red)}.bar .y{background:var(--yellow)}.bar .g{background:var(--green)}.bar .n{background:var(--gray)}
.filters{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font:500 14px/1 "Sora",sans-serif;cursor:pointer;min-height:36px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip b{font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.status{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted);min-height:20px}
.saving{display:none;color:var(--ink);font-weight:600}
.saving.on{display:inline}
.notice{margin:14px 0 0;padding:10px 12px;border-radius:10px;background:var(--gray-soft);font-size:14px;color:var(--ink);display:none}
.notice.on{display:block}
h2{font:700 20px/1.2 "Sora",system-ui,sans-serif;margin:26px 0 8px;color:var(--ink)}
ul.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li.it{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0 12px 12px;border-bottom:1px solid var(--line);border-left:4px solid var(--gray);position:relative}
li.it[data-s="r"]{border-left-color:var(--red)}
li.it[data-s="y"]{border-left-color:var(--yellow)}
li.it[data-s="g"]{border-left-color:var(--green)}
.meta{min-width:0}
.num{font:600 13px/1 "Sora",sans-serif;color:var(--muted);margin-right:6px}
.name{font-weight:600}
.note{display:block;color:var(--muted);font-size:14px;margin-top:3px;white-space:pre-wrap}
.editnote{display:block;background:none;border:0;color:var(--tape);font:500 14px/1 "Sora",sans-serif;padding:8px 0 0;cursor:pointer}
textarea{grid-column:1 / -1;width:100%;min-height:72px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--ink);font:400 15px/1.4 "Sora",sans-serif;resize:vertical}
.lights{display:flex;gap:6px;align-self:start;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:4px}
.lens{width:34px;height:34px;border-radius:50%;border:0;background:var(--lens-off);cursor:pointer;position:relative}
.lens.r{background:var(--red-soft)}.lens.y{background:var(--yellow-soft)}.lens.g{background:var(--green-soft)}
.lens span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lens.r[aria-pressed="true"]{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.lens.y[aria-pressed="true"]{background:var(--yellow);box-shadow:0 0 0 3px var(--yellow-soft)}
.lens.g[aria-pressed="true"]{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.lens:disabled{cursor:default}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
ul.todos{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ul.todos li{border-bottom:1px solid var(--line)}
.todo{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--ink);text-align:left;padding:12px 4px;font:500 16px/1.35 "Sora",sans-serif;cursor:pointer;min-height:48px}
.todo .box{flex:0 0 24px;height:24px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center}
.todo[aria-checked="true"] .box{background:var(--green);border-color:var(--green)}
.todo[aria-checked="true"] .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.todo[aria-checked="true"] .t{color:var(--muted);text-decoration:line-through}
.todo:disabled{cursor:default}
.due{margin:22px 0 0;border:3px solid var(--tape);border-radius:14px;padding:14px 14px 6px;background:var(--surface);transition:border-color .4s,background-color .4s}
.due.warn{border-color:var(--yellow)}
.due.hot{border-color:var(--red)}
.due.over{border-color:var(--red);background:var(--red-soft)}
.due.done{border-color:var(--green)}
.clock{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.clock b{font:700 52px/1 "Sora",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em;color:var(--ink)}
.clock span{font:600 15px/1.2 "Sora",sans-serif;color:var(--muted)}
.due.warn .clock b{color:var(--yellow-ink)}
.due.hot .clock b,.due.over .clock b,.due.over .clock span{color:var(--red)}
.due.done .clock b{color:var(--green)}
.due.over .clock b{animation:throb 1s ease-in-out infinite}
@keyframes throb{50%{opacity:.45}}
.drain{height:6px;border-radius:3px;background:var(--lens-off);overflow:hidden;margin:6px 0 10px}
.drain i{display:block;height:100%;background:var(--tape);transition:width 1s linear,background-color .4s}
.due.warn .drain i{background:var(--yellow)}.due.hot .drain i,.due.over .drain i{background:var(--red)}.due.done .drain i{background:var(--green)}
.photos{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 0 12px 36px}
.ph{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;background:var(--lens-off);display:block}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .rm{position:absolute;top:2px;right:2px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font:600 16px/26px "Sora",sans-serif;cursor:pointer;padding:0}
.addph{display:inline-flex;align-items:center;justify-content:center;height:64px;padding:0 12px;border:1.5px dashed var(--muted);border-radius:8px;background:none;color:var(--ink);font:600 14px/1.2 "Sora",sans-serif;cursor:pointer;text-align:center}
.addph:disabled{opacity:.6;cursor:default}
.phmsg{font-size:13px;color:var(--muted);width:100%}
.due h2{margin:0 0 2px}
.due .when{margin:0 0 8px;color:var(--muted);font-size:14px}
.due .when.late{color:var(--red);font-weight:600}
.due ol{list-style:none;margin:0;padding:0;counter-reset:d}
.due ol li{counter-increment:d;border-top:1px solid var(--line)}
.due .todo .box::before{content:counter(d);font:600 13px/1 "Sora",sans-serif;color:var(--muted)}
.due .todo[aria-checked="true"] .box::before{content:none}
#suggsec[hidden]{display:none}
.sform{display:grid;gap:8px;margin:4px 0 12px}
.sform input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:var(--surface);color:var(--ink);font:400 16px/1.3 "Sora",sans-serif;min-height:44px}
.sform button,.sacts button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font:600 15px/1 "Sora",sans-serif;cursor:pointer;min-height:44px}
.sform button{background:var(--tape);border-color:var(--tape);color:var(--tape-ink);justify-self:start}
.sform button:disabled{opacity:.6;cursor:default}
.smsg{font-size:14px;color:var(--muted);min-height:18px;margin:0}
ul.sugg{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ul.sugg li{padding:12px 0;border-bottom:1px solid var(--line)}
.sacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sacts .dismiss{color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.tools button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:11px 14px;font:600 15px/1 "Sora",sans-serif;cursor:pointer;min-height:44px}
.help{color:var(--muted);font-size:14px;margin-top:12px}
.empty{color:var(--muted);padding:24px 0}
@media (prefers-reduced-motion: reduce){.bar span,.drain i,.due{transition:none}.due.over .clock b{animation:none}}

/* HUD layer: monochrome, color only for status */
body{font-size:15px;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed}
.summary,body::before{background:var(--bg)}
.tape{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:0;padding:6px 10px 5px;transform:none;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%);font:600 12px/1 "Chakra Petch","Sora",sans-serif;letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px}
.tape::before{content:"";width:7px;height:7px;background:var(--ink);animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
h1{font:700 42px/1 "Chakra Petch","Sora",system-ui,sans-serif;letter-spacing:.01em;text-transform:uppercase;margin:0 0 10px}
header.top::after{content:"";display:block;height:10px;margin-top:16px;background:repeating-linear-gradient(-45deg,var(--ink) 0 6px,transparent 6px 13px);clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.sub{font-size:13.5px}
h2{font:600 13px/1.2 "Chakra Petch","Sora",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin:32px 0 10px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.bar{height:6px;gap:3px;background:transparent;border-radius:0}
.bar span{border-radius:0}
.chip{border-radius:0;font:500 12.5px/1 "Sora",sans-serif;padding:8px 12px;background:transparent;border:1px solid var(--line);clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:none}
.chip i{width:7px;height:7px;border-radius:0}
.status{font-family:"Chakra Petch","Sora",sans-serif;letter-spacing:.04em}
ul.items{border-top:1px solid var(--line)}
li.it{border-left-width:2px;padding-left:14px}
.num{font:600 12px/1 "Chakra Petch",sans-serif;letter-spacing:.06em}
.name{font-weight:500}
.urg{width:17px;height:17px;vertical-align:-3px;margin-right:6px;color:var(--ink);flex:0 0 auto}
li.it.urgent{background:linear-gradient(90deg,color-mix(in srgb,var(--ink) 6%,transparent),transparent 70%)}
.acts{display:flex;gap:18px;flex-wrap:wrap}
.editnote,.crit{display:inline-block;background:none;border:0;color:var(--ink);font:500 13px/1 "Sora",sans-serif;padding:10px 0 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.crit{display:inline-flex;align-items:center;gap:5px;text-decoration:none}
.crit .urg{width:14px;height:14px;margin:0}
.lights{background:transparent;border:0;padding:0;gap:9px;align-self:center}
.lens{width:24px;height:24px;background:transparent!important;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ink) 38%,transparent)!important;transition:background-color .2s,box-shadow .2s}
.lens.r[aria-pressed="true"]{background:var(--red)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 22%,transparent),0 0 14px var(--red)!important}
.lens.y[aria-pressed="true"]{background:var(--yellow)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--yellow) 25%,transparent),0 0 14px var(--yellow)!important}
.lens.g[aria-pressed="true"]{background:var(--green)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 22%,transparent),0 0 14px var(--green)!important}
.lens::after{content:"";position:absolute;inset:-10px}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.todo{font-weight:400}
.todo .box{flex-basis:22px;height:22px;border:1.5px solid var(--ink);border-radius:0}
.todo[aria-checked="true"] .box{background:var(--ink);border-color:var(--ink);box-shadow:none}
.todo[aria-checked="true"] .box::after{border-color:var(--bg)}
.todo .ref{font:600 12px/1 "Chakra Petch",sans-serif;letter-spacing:.06em;color:var(--muted)}
.due{--glow:var(--ink);position:relative;border:1px solid var(--line);border-radius:0;padding:18px 16px 8px;
  background:linear-gradient(var(--glow),var(--glow)) top left/16px 2px no-repeat,linear-gradient(var(--glow),var(--glow)) top left/2px 16px no-repeat,linear-gradient(var(--glow),var(--glow)) top right/16px 2px no-repeat,linear-gradient(var(--glow),var(--glow)) top right/2px 16px no-repeat,linear-gradient(var(--glow),var(--glow)) bottom left/16px 2px no-repeat,linear-gradient(var(--glow),var(--glow)) bottom left/2px 16px no-repeat,linear-gradient(var(--glow),var(--glow)) bottom right/16px 2px no-repeat,linear-gradient(var(--glow),var(--glow)) bottom right/2px 16px no-repeat,var(--bg);
  box-shadow:0 0 28px color-mix(in srgb,var(--glow) 10%,transparent)}
.due::before{content:"";display:block;height:8px;margin:0 0 14px;background:repeating-linear-gradient(-45deg,var(--glow) 0 7px,transparent 7px 14px);clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.due.warn{--glow:var(--yellow)} .due.hot,.due.over{--glow:var(--red)} .due.done{--glow:var(--green)}
.due.over{background-color:color-mix(in srgb,var(--red) 6%,var(--bg))}
.duehead{display:flex;align-items:center;gap:10px;justify-content:space-between}
.duehead h2{margin:0;flex:1}
.duehead h2::after{display:none}
.duehead .urg{width:22px;height:22px;margin:0;color:var(--glow)}
.dueby{font:500 13px/1.3 "Sora",sans-serif;color:var(--muted);margin:6px 0 0}
.dbtn{background:none;border:1px solid var(--ink);color:var(--ink);font:600 12px/1 "Chakra Petch",sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:9px 11px;cursor:pointer;border-radius:0;min-height:36px}
.dbtn.solid{background:var(--ink);color:var(--bg)}
.clock b{font:600 66px/1 "Chakra Petch","Sora",system-ui,sans-serif;letter-spacing:.02em;color:var(--ink)}
.clock span{font:600 12px/1 "Chakra Petch",sans-serif;letter-spacing:.14em;text-transform:uppercase}
.due.warn .clock b{color:var(--yellow-ink)}
.due.over .clock b,.due.hot .clock b{color:var(--red);text-shadow:0 0 18px color-mix(in srgb,var(--red) 50%,transparent)}
.due.done .clock b{color:var(--green)}
.drain{height:8px;border-radius:0;background:repeating-linear-gradient(90deg,var(--lens-off) 0 6px,transparent 6px 8px)}
.drain i{background:repeating-linear-gradient(90deg,var(--glow) 0 6px,transparent 6px 8px)!important;box-shadow:none}
.due .when{font-family:"Chakra Petch","Sora",sans-serif;letter-spacing:.06em}
.due ol li{border-top:1px solid var(--line)}
.due .todo .box::before{font:600 12px/1 "Chakra Petch",sans-serif;color:var(--ink)}
.drm{flex:0 0 auto;width:36px;height:36px;border:1px solid var(--line);background:none;color:var(--ink);font:500 18px/1 "Sora",sans-serif;cursor:pointer;border-radius:0}
.dueitem{display:flex;align-items:center;gap:8px}
.dueedit{display:grid;gap:8px;margin:12px 0 12px;padding:12px;border:1px dashed var(--line)}
.dueedit label{font:600 11.5px/1 "Chakra Petch",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.drow{display:flex;gap:8px;flex-wrap:wrap}
.drow input{flex:1 1 180px}
.ph{border-radius:0;width:56px;height:56px;outline:1px solid var(--line)}
.ph .rm{border-radius:0}
.addph{height:56px;border:1px dashed var(--muted);border-radius:0;font:600 11.5px/1.2 "Chakra Petch",sans-serif;letter-spacing:.1em;text-transform:uppercase}
.notice{border-radius:0;border:1px solid var(--line);background:transparent}
.sform input,textarea{border-radius:0;background:transparent}
.sform button,.sacts button,.tools button{border-radius:0;font:600 12.5px/1 "Chakra Petch",sans-serif;letter-spacing:.1em;text-transform:uppercase;background:transparent;border:1px solid var(--ink)}
.sform button{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:none;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}

.acc{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0;font-size:13.5px;color:var(--muted)}
.acc b{color:var(--ink);font-weight:600}
.acc button{background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font:500 13px/1 "Sora",sans-serif;cursor:pointer;padding:8px 0}

<body>
<div class="wrap">
  <header class="top">
    <div class="tape">Live status</div>
    <h1>Project760</h1>
    <p class="sub">Tap a light to set an item’s status. Tap it again to clear it.</p>
  </header>
  <section id="access" hidden></section>
  <div class="summary">
